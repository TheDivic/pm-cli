# golangci-lint v2 configuration. Run with `make lint` (or `golangci-lint run`).
# CI installs golangci-lint via the official action; keep this schema in sync
# with the installed major version.
version: "2"

linters:
  enable:
    # errcheck, govet, ineffassign, staticcheck, and unused are on by default.
    - misspell
    - revive
  settings:
    errcheck:
      # Writes to terminal streams and tabwriters don't warrant error checks;
      # real file writes go through the dedicated atomic writer.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/TheDivic/pm-cli
