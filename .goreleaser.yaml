# GoReleaser configuration for cross-platform pm binaries.
# Release with: git tag vX.Y.Z && git push --tags  (CI runs goreleaser).
version: 2

project_name: pm

before:
  hooks:
    - go mod tidy

builds:
  - id: pm
    main: ./cmd/pm
    binary: pm
    env:
      - CGO_ENABLED=0
    # Unix only: internal/lockfile takes its advisory lock with flock, which
    # Windows does not provide. Adding Windows means a LockFileEx build-tagged
    # implementation, not a target here.
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/TheDivic/pm-cli/internal/cli.version={{ .Version }}
      - -X github.com/TheDivic/pm-cli/internal/cli.commit={{ .ShortCommit }}
      - -X github.com/TheDivic/pm-cli/internal/cli.date={{ .Date }}

archives:
  - id: pm
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
